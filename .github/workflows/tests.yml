name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # match the Docker image
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -v

  deploy:
    needs: test                     # only runs if every test passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write               # lets this job get a GitHub identity token for Google
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT }}
      REGION: us-central1
      SERVICE: loss-ratio-api
      IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/eb-rampup/trainer:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud (no key file)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker build -t $IMAGE .
          docker push $IMAGE

      # NEW: deploy the revision with NO traffic, tagged "candidate".
      # Users keep hitting the current revision; the candidate gets its own private URL.
      - name: Deploy the candidate revision (no traffic yet)
        id: deploy
        run: |
          gcloud run deploy $SERVICE --image $IMAGE --region $REGION \
            --service-account ${{ vars.API_SA }} \
            --set-env-vars GCP_PROJECT=$PROJECT_ID,GCP_REGION=$REGION,MODEL_NAME=loss-ratio-ltd \
            --memory 1Gi --max-instances 2 --no-allow-unauthenticated \
            --no-traffic --tag candidate \
            --add-custom-audiences=loss-ratio-api --quiet
          # NEW: the candidate's own URL, e.g. https://candidate---loss-ratio-api-....run.app
          URL=$(gcloud run services describe $SERVICE --region $REGION --format=json \
            | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Unchanged, but the URL is now the candidate's, not the live service's
      - name: Get a token to call the candidate
        id: token
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: loss-ratio-api
          id_token_include_email: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # The smoke test now runs against the candidate. If it fails, the job stops here
      # and the next step never runs: no user ever sees the bad revision.
      - name: Smoke test the candidate
        env:
          API_URL: ${{ steps.deploy.outputs.url }}
          API_TOKEN: ${{ steps.token.outputs.id_token }}
        run: |
          pip install -e ".[dev]"
          pytest -m integration tests/test_INTEGRATION_client_call.py -v

      # NEW: only reached if the smoke test passed. Move all traffic to the new revision.
      - name: Send traffic to the candidate
        run: gcloud run services update-traffic $SERVICE --region $REGION --to-latest