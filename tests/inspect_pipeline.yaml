# PIPELINE DEFINITION
# Name: loss-ratio-training
# Inputs:
#    auto_promote: bool [Default: True]
#    git_sha: str [Default: 'unknown']
#    min_improvement: float [Default: 0.0]
#    min_rows: int [Default: 1000.0]
#    model_name: str [Default: 'loss-ratio-ltd']
#    project: str
#    region: str [Default: 'us-central1']
#    serving_image: str [Default: 'us-docker.pkg.dev/vertex-ai/prediction/xgboost-cpu.2-1:latest']
#    table: str [Default: 'eb_rampup.groups']
components:
  comp-compare-with-champion:
    executorLabel: exec-compare-with-champion
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        min_improvement:
          parameterType: NUMBER_DOUBLE
        model_name:
          parameterType: STRING
        project:
          parameterType: STRING
        region:
          parameterType: STRING
    outputDefinitions:
      parameters:
        promote:
          parameterType: BOOLEAN
        reason:
          parameterType: STRING
  comp-condition-1:
    dag:
      tasks:
        condition-branches-2:
          componentRef:
            name: comp-condition-branches-2
          inputs:
            artifacts:
              pipelinechannel--train-model:
                componentInputArtifact: pipelinechannel--train-model
            parameters:
              pipelinechannel--auto_promote:
                componentInputParameter: pipelinechannel--auto_promote
              pipelinechannel--compare-with-champion-promote:
                componentInputParameter: pipelinechannel--compare-with-champion-promote
              pipelinechannel--git_sha:
                componentInputParameter: pipelinechannel--git_sha
              pipelinechannel--model_name:
                componentInputParameter: pipelinechannel--model_name
              pipelinechannel--project:
                componentInputParameter: pipelinechannel--project
              pipelinechannel--region:
                componentInputParameter: pipelinechannel--region
              pipelinechannel--serving_image:
                componentInputParameter: pipelinechannel--serving_image
          taskInfo:
            name: condition-branches-2
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--auto_promote:
          parameterType: BOOLEAN
        pipelinechannel--compare-with-champion-promote:
          parameterType: BOOLEAN
        pipelinechannel--git_sha:
          parameterType: STRING
        pipelinechannel--model_name:
          parameterType: STRING
        pipelinechannel--project:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--serving_image:
          parameterType: STRING
  comp-condition-3:
    dag:
      tasks:
        register-model:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-register-model
          inputs:
            artifacts:
              model:
                componentInputArtifact: pipelinechannel--train-model
            parameters:
              alias:
                runtimeValue:
                  constant: champion
              git_sha:
                componentInputParameter: pipelinechannel--git_sha
              model_name:
                componentInputParameter: pipelinechannel--model_name
              project:
                componentInputParameter: pipelinechannel--project
              region:
                componentInputParameter: pipelinechannel--region
              serving_image:
                componentInputParameter: pipelinechannel--serving_image
          taskInfo:
            name: register-model
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--auto_promote:
          parameterType: BOOLEAN
        pipelinechannel--compare-with-champion-promote:
          parameterType: BOOLEAN
        pipelinechannel--git_sha:
          parameterType: STRING
        pipelinechannel--model_name:
          parameterType: STRING
        pipelinechannel--project:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--serving_image:
          parameterType: STRING
  comp-condition-4:
    dag:
      tasks:
        register-model-2:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-register-model-2
          inputs:
            artifacts:
              model:
                componentInputArtifact: pipelinechannel--train-model
            parameters:
              alias:
                runtimeValue:
                  constant: pending-review
              git_sha:
                componentInputParameter: pipelinechannel--git_sha
              model_name:
                componentInputParameter: pipelinechannel--model_name
              project:
                componentInputParameter: pipelinechannel--project
              region:
                componentInputParameter: pipelinechannel--region
              serving_image:
                componentInputParameter: pipelinechannel--serving_image
          taskInfo:
            name: register-model-2
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--auto_promote:
          parameterType: BOOLEAN
        pipelinechannel--compare-with-champion-promote:
          parameterType: BOOLEAN
        pipelinechannel--git_sha:
          parameterType: STRING
        pipelinechannel--model_name:
          parameterType: STRING
        pipelinechannel--project:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--serving_image:
          parameterType: STRING
  comp-condition-branches-2:
    dag:
      tasks:
        condition-3:
          componentRef:
            name: comp-condition-3
          inputs:
            artifacts:
              pipelinechannel--train-model:
                componentInputArtifact: pipelinechannel--train-model
            parameters:
              pipelinechannel--auto_promote:
                componentInputParameter: pipelinechannel--auto_promote
              pipelinechannel--compare-with-champion-promote:
                componentInputParameter: pipelinechannel--compare-with-champion-promote
              pipelinechannel--git_sha:
                componentInputParameter: pipelinechannel--git_sha
              pipelinechannel--model_name:
                componentInputParameter: pipelinechannel--model_name
              pipelinechannel--project:
                componentInputParameter: pipelinechannel--project
              pipelinechannel--region:
                componentInputParameter: pipelinechannel--region
              pipelinechannel--serving_image:
                componentInputParameter: pipelinechannel--serving_image
          taskInfo:
            name: auto-promote
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--auto_promote'] ==
              true
        condition-4:
          componentRef:
            name: comp-condition-4
          inputs:
            artifacts:
              pipelinechannel--train-model:
                componentInputArtifact: pipelinechannel--train-model
            parameters:
              pipelinechannel--auto_promote:
                componentInputParameter: pipelinechannel--auto_promote
              pipelinechannel--compare-with-champion-promote:
                componentInputParameter: pipelinechannel--compare-with-champion-promote
              pipelinechannel--git_sha:
                componentInputParameter: pipelinechannel--git_sha
              pipelinechannel--model_name:
                componentInputParameter: pipelinechannel--model_name
              pipelinechannel--project:
                componentInputParameter: pipelinechannel--project
              pipelinechannel--region:
                componentInputParameter: pipelinechannel--region
              pipelinechannel--serving_image:
                componentInputParameter: pipelinechannel--serving_image
          taskInfo:
            name: condition-4
          triggerPolicy:
            condition: '!(inputs.parameter_values[''pipelinechannel--auto_promote'']
              == true)'
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--auto_promote:
          parameterType: BOOLEAN
        pipelinechannel--compare-with-champion-promote:
          parameterType: BOOLEAN
        pipelinechannel--git_sha:
          parameterType: STRING
        pipelinechannel--model_name:
          parameterType: STRING
        pipelinechannel--project:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--serving_image:
          parameterType: STRING
  comp-register-model:
    executorLabel: exec-register-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        alias:
          parameterType: STRING
        git_sha:
          parameterType: STRING
        model_name:
          parameterType: STRING
        project:
          parameterType: STRING
        region:
          parameterType: STRING
        serving_image:
          parameterType: STRING
  comp-register-model-2:
    executorLabel: exec-register-model-2
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        alias:
          parameterType: STRING
        git_sha:
          parameterType: STRING
        model_name:
          parameterType: STRING
        project:
          parameterType: STRING
        region:
          parameterType: STRING
        serving_image:
          parameterType: STRING
  comp-train:
    executorLabel: exec-train
    inputDefinitions:
      artifacts:
        data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-validate-data:
    executorLabel: exec-validate-data
    inputDefinitions:
      parameters:
        min_rows:
          parameterType: NUMBER_INTEGER
        project:
          parameterType: STRING
        table:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-compare-with-champion:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - compare_with_champion
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef compare_with_champion(\n    model: Input[Model], test_data: Input[Dataset],\
          \ project: str, region: str,\n    model_name: str, min_improvement: float,\n\
          ) -> NamedTuple(\"Outputs\", [(\"promote\", bool), (\"reason\", str)]):\n\
          \    \"\"\"Score BOTH models on the challenger's test rows, so they're judged\
          \ on the same data.\"\"\"\n    import json\n    import tempfile\n    from\
          \ collections import namedtuple\n    from pathlib import Path\n\n    import\
          \ pandas as pd\n\n    from eb_rampup.features import TARGET, sample_weights\n\
          \    from eb_rampup.promotion import should_promote\n    from eb_rampup.registry\
          \ import download_dir, find_champion\n    from eb_rampup.serving import\
          \ FeatureMismatchError, load_model_dir\n    from eb_rampup.train import\
          \ weighted_mae\n\n    test_df = pd.read_parquet(test_data.path)\n    y,\
          \ w = test_df[TARGET], sample_weights(test_df)\n\n    challenger = json.loads((Path(model.path)\
          \ / \"metrics.json\").read_text())\n    challenger[\"mae\"] = weighted_mae(y,\
          \ load_model_dir(model.path).predict(test_df), w)\n\n    champion = None\n\
          \    found = find_champion(project, region, model_name)\n    if found is\
          \ None:\n        print(\"No champion yet\")\n    else:\n        local =\
          \ download_dir(found.uri, tempfile.mkdtemp(), project)\n        try:\n \
          \           champ_model = load_model_dir(local, version=str(found.version_id))\n\
          \            champion = {\"mae\": weighted_mae(y, champ_model.predict(test_df),\
          \ w)}\n            print(f\"Champion is version {found.version_id}; \"\n\
          \                  f\"on this test data its MAE is {champion['mae']:.4f}\"\
          )\n        except FeatureMismatchError as e:\n            print(f\"Champion\
          \ can't score today's features, so it can't be compared: {e}\")\n\n    promote,\
          \ reason = should_promote(challenger, champion, min_improvement)\n    print(reason)\n\
          \    return namedtuple(\"Outputs\", [\"promote\", \"reason\"])(promote,\
          \ reason)\n\n"
        image: trainer:placeholder
    exec-register-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model(\n    model: Input[Model], project: str, region:\
          \ str, model_name: str,\n    serving_image: str, git_sha: str, alias: str,\
          \      # NEW: \"champion\" or \"pending-review\"\n):\n    import json\n\
          \    from pathlib import Path\n\n    from google.cloud import aiplatform\n\
          \n    aiplatform.init(project=project, location=region)\n    metrics = json.loads((Path(model.path)\
          \ / \"metrics.json\").read_text())\n    existing = aiplatform.Model.list(filter=f'display_name=\"\
          {model_name}\"')\n\n    registered = aiplatform.Model.upload(\n        display_name=model_name,\n\
          \        artifact_uri=model.uri,\n        serving_container_image_uri=serving_image,\n\
          \        parent_model=existing[0].resource_name if existing else None,\n\
          \        is_default_version=(alias == \"champion\"),\n        version_aliases=[alias],\
          \  # an alias moves off whichever version had it\n        version_description=f\"\
          MAE {metrics['mae']:.4f} | registered as {alias}\",\n        labels={\"\
          git_sha\": git_sha},\n    )\n\n    # Verify instead of assuming: fail loudly\
          \ if the alias didn't land\n    registry = aiplatform.models.ModelRegistry(registered)\n\
          \    holders = [v.version_id for v in registry.list_versions() if alias\
          \ in v.version_aliases]\n    if holders != [registered.version_id]:\n  \
          \      raise RuntimeError(f\"Expected version {registered.version_id} to\
          \ be {alias}, found {holders}\")\n    print(f\"Registered version {registered.version_id}\
          \ as {alias}\")\n\n"
        image: trainer:placeholder
    exec-register-model-2:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model(\n    model: Input[Model], project: str, region:\
          \ str, model_name: str,\n    serving_image: str, git_sha: str, alias: str,\
          \      # NEW: \"champion\" or \"pending-review\"\n):\n    import json\n\
          \    from pathlib import Path\n\n    from google.cloud import aiplatform\n\
          \n    aiplatform.init(project=project, location=region)\n    metrics = json.loads((Path(model.path)\
          \ / \"metrics.json\").read_text())\n    existing = aiplatform.Model.list(filter=f'display_name=\"\
          {model_name}\"')\n\n    registered = aiplatform.Model.upload(\n        display_name=model_name,\n\
          \        artifact_uri=model.uri,\n        serving_container_image_uri=serving_image,\n\
          \        parent_model=existing[0].resource_name if existing else None,\n\
          \        is_default_version=(alias == \"champion\"),\n        version_aliases=[alias],\
          \  # an alias moves off whichever version had it\n        version_description=f\"\
          MAE {metrics['mae']:.4f} | registered as {alias}\",\n        labels={\"\
          git_sha\": git_sha},\n    )\n\n    # Verify instead of assuming: fail loudly\
          \ if the alias didn't land\n    registry = aiplatform.models.ModelRegistry(registered)\n\
          \    holders = [v.version_id for v in registry.list_versions() if alias\
          \ in v.version_aliases]\n    if holders != [registered.version_id]:\n  \
          \      raise RuntimeError(f\"Expected version {registered.version_id} to\
          \ be {alias}, found {holders}\")\n    print(f\"Registered version {registered.version_id}\
          \ as {alias}\")\n\n"
        image: trainer:placeholder
    exec-train:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train(\n    data: Input[Dataset],\n    model: Output[Model],\n\
          \    metrics: Output[Metrics],\n    test_data: Output[Dataset],        \
          \  # NEW: so the comparison can reuse the same rows\n):\n    import pandas\
          \ as pd\n\n    from eb_rampup.features import TARGET, build_features, sample_weights\n\
          \    from eb_rampup.train import evaluate, save_artifacts, split, train_model\n\
          \n    df = pd.read_parquet(data.path)\n    train_df, test_df = split(df)\n\
          \    fitted = train_model(build_features(train_df), train_df[TARGET], sample_weights(train_df))\n\
          \    results = evaluate(fitted, train_df, test_df)\n\n    save_artifacts(fitted,\
          \ model.path, results)  # model.path is a folder under /gcs/\n    for name,\
          \ value in results.items():\n        metrics.log_metric(name, value)  #\
          \ shows up in the pipeline console\n    test_df.to_parquet(test_data.path,\
          \ index=False)\n\n"
        image: trainer:placeholder
    exec-validate-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - validate_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef validate_data(project: str, table: str, min_rows: int, data:\
          \ Output[Dataset]):\n    from google.cloud import bigquery\n\n    from eb_rampup.bq\
          \ import load_table\n    from eb_rampup.validation import validate_groups\n\
          \n    df = load_table(bigquery.Client(project=project), table)\n    problems\
          \ = validate_groups(df, min_rows=min_rows)\n    if problems:\n        raise\
          \ ValueError(\"Data validation failed:\\n- \" + \"\\n- \".join(problems))\n\
          \n    df.to_parquet(data.path, index=False)\n    data.metadata[\"row_count\"\
          ] = len(df)\n\n"
        image: trainer:placeholder
pipelineInfo:
  name: loss-ratio-training
root:
  dag:
    tasks:
      compare-with-champion:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-compare-with-champion
        dependentTasks:
        - train
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: train
          parameters:
            min_improvement:
              componentInputParameter: min_improvement
            model_name:
              componentInputParameter: model_name
            project:
              componentInputParameter: project
            region:
              componentInputParameter: region
        taskInfo:
          name: compare-with-champion
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - compare-with-champion
        - train
        inputs:
          artifacts:
            pipelinechannel--train-model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train
          parameters:
            pipelinechannel--auto_promote:
              componentInputParameter: auto_promote
            pipelinechannel--compare-with-champion-promote:
              taskOutputParameter:
                outputParameterKey: promote
                producerTask: compare-with-champion
            pipelinechannel--git_sha:
              componentInputParameter: git_sha
            pipelinechannel--model_name:
              componentInputParameter: model_name
            pipelinechannel--project:
              componentInputParameter: project
            pipelinechannel--region:
              componentInputParameter: region
            pipelinechannel--serving_image:
              componentInputParameter: serving_image
        taskInfo:
          name: beats-champion
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--compare-with-champion-promote']
            == true
      train:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train
        dependentTasks:
        - validate-data
        inputs:
          artifacts:
            data:
              taskOutputArtifact:
                outputArtifactKey: data
                producerTask: validate-data
        taskInfo:
          name: train
      validate-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-validate-data
        inputs:
          parameters:
            min_rows:
              componentInputParameter: min_rows
            project:
              componentInputParameter: project
            table:
              componentInputParameter: table
        taskInfo:
          name: validate-data
  inputDefinitions:
    parameters:
      auto_promote:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      git_sha:
        defaultValue: unknown
        isOptional: true
        parameterType: STRING
      min_improvement:
